server {
    listen 80;

    location /api/v1/productos {
        proxy_pass http://svc-catalogo:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/v1/pedidos {
        proxy_pass http://svc-pedidos:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
