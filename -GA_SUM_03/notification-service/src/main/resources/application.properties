server.port=8003
spring.application.name=notification-service

# Database
spring.datasource.url=${NOTIF_DATABASE_URL:jdbc:postgresql://notification-db:5432/notificationdb}
spring.datasource.username=${NOTIF_POSTGRES_USER:notif_user}
spring.datasource.password=${NOTIF_POSTGRES_PASSWORD:notif_password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# SMTP Configuration (simulated, logged to console)
smtp.host=${SMTP_HOST:smtp.example.com}
smtp.port=${SMTP_PORT:587}
smtp.user=${SMTP_USER:notifications@tiendatech.com}
smtp.from=${SMTP_FROM:alerts@tiendatech.com}
